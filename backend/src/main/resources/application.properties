spring.application.name=ai-pdlc-backend
server.port=8080

spring.datasource.url=${AI_PDLC_DB_URL:jdbc:postgresql://localhost:5432/ai_pdlc}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${AI_PDLC_DB_USER:ai_pdlc}
spring.datasource.password=${AI_PDLC_DB_PASSWORD:ai_pdlc}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
